logLevel: info
logDestinations: [stdout, file]
logFile: D:/cctv/mediamtx.log

api: yes
apiAddress: 127.0.0.1:9997

playback: yes
playbackAddress: :9996
playbackAllowOrigins: ['*']

hls: yes
